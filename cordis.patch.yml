# dsh-aimy 的 bundle patch：把插件挂进 DSH 配置树。
#
# - id 必须全局唯一且与包名一致（插件市场按它比对 entry ID）。
# - name 解析到包的 main 入口（lib/index.js，宿主半侧）。
# - package.json 里声明了 dsh.client，DSH 模块系统会同时把本包扫描为浏览器插件，
#   提供 /plugins/dsh-aimy/client.js 给页面。
#
# 面板有两个 Tab（入口在首页左侧栏，不占用设置页）：
#   Aimy-艾米（预设，地址只读展示、不可编辑；支持真实切分组）
#   兼容模式（用户自填 URL + 协议，适配 new-api / sub2api 等）
- insert:
    - id: dsh-aimy
      name: 'dsh-aimy'
      config:
        # ── Aimy 预设 ─────────────────────────────────────────────
        # 站点根地址（不要带 /v1）；界面上只读展示、用户不可改
        baseURL: 'https://aimy.sheep1x.top'
        # 密钥的凭据引用名；host 侧通过 ctx.credentials.resolve() 解析，不落明文
        apiKeyRef: 'ONEHUB_API_KEY'
        # 模型选择器里显示名
        displayName: 'Aimy-艾米'
        # pi-ai 路由名
        routeName: 'onehub'
        # 协议：openai-responses（默认）| openai-completions | anthropic-messages
        api: 'openai-responses'

        # ── 兼容模式 ──────────────────────────────────────────────
        # 地址与协议由面板写入 $DSH_HOME/dsh-aimy/profiles.json，
        # 这里只给默认协议；密钥固定用 ONEHUB_COMPAT_API_KEY
        compatApi: 'openai-responses'

        # ── 模型能力默认 ───────────────────────────────────────────
        # 真实取值按三层解析（见 src/host/capacity.ts）：
        #   站点 /v1/models 声明的容量 → pi-ai 官方目录 → 这里的兜底值。
        # 注意：这两个数只是 provider 级 fallback，pi-ai **不会把它上报给 DSH**；
        # 真正生效的是逐模型 entry.maxTokens（插件会自动写）。
        defaultContextWindow: 1000000
        defaultMaxTokens: 128000
        # 是否给模型声明 image 模态；面板「图片输入」开关会覆盖它并落盘
        imageInput: true
